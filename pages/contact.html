<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />
  </head>
  <body class="color-scheme-light">
    <script src="../script.js" defer></script>
    <nav
      class="navbar sm:navbar-expand bg-1 fg-2 theme-primary theme-contrast"
      data-bs-theme="dark"
    >
      <div class="container-fluid">
        <a
          class="navbar-brand instrument-serif-regular fs-lg text"
          href="../index.html"
          >LMS</a
        >
        <button
          class="btn-icon navbar-toggler"
          type="button"
          data-bs-toggle="drawer"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon" aria-hidden="true"></span>
        </button>
        <dialog
          class="drawer drawer-end"
          tabindex="-1"
          id="navbarNav"
          aria-labelledby="navbarNavLabel"
        >
          <div class="drawer-body">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item">
                <a
                  class="nav-link text-white"
                  aria-current="page"
                  href="../index.html"
                  >Home</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link text-white-50" href="courses.html"
                  >Courses</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link text-white-50" href="about-us.html">About</a>
              </li>
              <li class="nav-item">
                <a class="nav-link text-white-50" href="contact.html"
                  >Contact</a
                >
              </li>
              <li id="themeToggle" class="nav-item">
                <button class="btn btn-secondary bg-primary" type="button">
                  Switch Theme
                </button>
              </li>
            </ul>
          </div>
        </dialog>
      </div>
    </nav>

    <div>
      <section id="contact" class="mb-5 w-100 p-5">
        <form action="https://formspree.io/f/moejralo" method="POST">
          <div class="pt-10">
            <h2 class="text-center fs-2xl text">Contact Us</h2>
          </div>

          <div class="p-5">
            <label for="nameInput" class="form-label">Name</label>
            <label class="form-control form-adorn form-adorn-end">
              <div class="form-adorn-icon" aria-hidden="true">
                <svg
                  class="bi"
                  width="16"
                  height="16"
                  viewBox="0 0 16 16"
                  fill="currentColor"
                >
                  <path
                    d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6"
                  />
                </svg>
              </div>
              <input
                type="text"
                class="form-ghost"
                id="nameInput"
                name="name"
                placeholder="Your Name"
                required
              />
            </label>
          </div>

          <div class="form-field p-5">
            <label for="fieldText" class="form-label">Email address</label>
            <input
              type="email"
              class="form-control"
              id="fieldText"
              name="email"
              placeholder="youremail@email.com"
              required
            />
          </div>

          <div class="form-field p-5">
            <label for="fieldTextarea" class="form-label">Message</label>
            <textarea
              class="form-control"
              id="fieldTextarea"
              name="message"
              rows="3"
              required
            ></textarea>
          </div>

          <input
            type="text"
            name="_gotcha"
            tabindex="-1"
            autocomplete="off"
            style="display: none !important"
          />

          <div class="p-5">
            <button type="submit" class="btn-solid theme-primary">
              Submit
            </button>
          </div>
        </form>
      </section>
    </div>
  </body>
</html>
